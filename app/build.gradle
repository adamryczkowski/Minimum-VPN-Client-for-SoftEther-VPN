plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
    id 'jacoco'
}

// Load version properties
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

def versionMajor = (versionProps['VERSION_MAJOR'] ?: '1').toInteger()
def versionMinor = (versionProps['VERSION_MINOR'] ?: '0').toInteger()
def versionPatch = (versionProps['VERSION_PATCH'] ?: '0').toInteger()
def appVersionCode = (versionProps['VERSION_CODE'] ?: '1').toInteger()
def appVersionName = "${versionMajor}.${versionMinor}.${versionPatch}"

// Load keystore properties for release signing
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'kittoku.mvc'
    compileSdk 36

    defaultConfig {
        applicationId "kittoku.mvc"
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Build config fields for version info
        buildConfigField "String", "VERSION_NAME_FULL", "\"${appVersionName} (${appVersionCode})\""
        buildConfigField "int", "VERSION_MAJOR", "${versionMajor}"
        buildConfigField "int", "VERSION_MINOR", "${versionMinor}"
        buildConfigField "int", "VERSION_PATCH", "${versionPatch}"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                // Use rootProject.file() to resolve paths relative to project root
                storeFile rootProject.file(keystoreProps['storeFile'] ?: 'release.keystore')
                storePassword keystoreProps['storePassword'] ?: ''
                keyAlias keystoreProps['keyAlias'] ?: 'softether-connect'
                keyPassword keystoreProps['keyPassword'] ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Use release signing config if available
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            testCoverageEnabled true
            // Disable minification for faster debug builds
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                useJUnitPlatform()
                // Pass environment variables to test JVM for integration tests
                environment 'TEST_HOST', System.getenv('TEST_HOST') ?: ''
                environment 'TEST_PORT', System.getenv('TEST_PORT') ?: ''
                environment 'TEST_USERNAME', System.getenv('TEST_USERNAME') ?: ''
                environment 'TEST_PASSWORD', System.getenv('TEST_PASSWORD') ?: ''
            }
        }
    }
}

// Versions
def versions = [
    coroutines: '1.10.2',
    mockk: '1.14.7',
    junit5: '5.11.4',
    truth: '1.4.5',
    androidxTest: '1.6.1',
    espresso: '3.6.1',
    koin: '4.0.0',
    lifecycle: '2.10.0',
    room: '2.8.4',
    serialization: '1.9.0',
    encryptedPrefs: '1.1.1', // ed-george/encrypted-shared-preferences fork
]

dependencies {
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${versions.coroutines}"

    // AndroidX Lifecycle - ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${versions.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${versions.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${versions.lifecycle}"

    // Room Database
    implementation "androidx.room:room-runtime:${versions.room}"
    implementation "androidx.room:room-ktx:${versions.room}"
    ksp "androidx.room:room-compiler:${versions.room}"
    testImplementation "androidx.room:room-testing:${versions.room}"
    androidTestImplementation "androidx.room:room-testing:${versions.room}"

    // Kotlinx Serialization (JSON)
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${versions.serialization}"

    // Encrypted SharedPreferences (ed-george fork - post-deprecation support)
    // For secure credential storage
    implementation "dev.spght:encryptedprefs-ktx:${versions.encryptedPrefs}"

    // Koin - Dependency Injection
    implementation "io.insert-koin:koin-android:${versions.koin}"
    testImplementation "io.insert-koin:koin-test:${versions.koin}"
    testImplementation "io.insert-koin:koin-test-junit5:${versions.koin}"

    // === Unit Testing ===
    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter-api:${versions.junit5}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${versions.junit5}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${versions.junit5}"

    // JUnit 4 support for legacy tests (can be removed after migration)
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine:${versions.junit5}"

    // MockK - Kotlin mocking library
    testImplementation "io.mockk:mockk:${versions.mockk}"

    // Coroutines testing
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${versions.coroutines}"

    // Google Truth - Fluent assertions
    testImplementation "com.google.truth:truth:${versions.truth}"

    // === Instrumented Testing (Android) ===
    androidTestImplementation "androidx.test:runner:${versions.androidxTest}"
    androidTestImplementation "androidx.test:rules:${versions.androidxTest}"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:${versions.espresso}"

    // MockK for Android instrumented tests
    androidTestImplementation "io.mockk:mockk-android:${versions.mockk}"

    // Truth for Android tests
    androidTestImplementation "com.google.truth:truth:${versions.truth}"

    // Coroutines testing for Android
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${versions.coroutines}"
}

ktlint {
    android = true
    outputToConsole = true
    ignoreFailures = false
}

// Detekt configuration for static analysis
detekt {
    toolVersion = "1.23.8"
    config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
    buildUponDefaultConfig = true
    allRules = false
    parallel = true
    ignoreFailures = false
    basePath = projectDir.absolutePath
    baseline = file("detekt-baseline.xml")
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    reports {
        html.required = true
        xml.required = true
        sarif.required = true
        txt.required = false
        md.required = true
    }
}

// JaCoCo configuration for code coverage
jacoco {
    toolVersion = "0.8.12"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/databinding/**',
        '**/android/databinding/*Binding.*',
    ]

    def debugTree = fileTree(
        dir: "${buildDir}/tmp/kotlin-classes/debug",
        excludes: fileFilter
    )

    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(
        dir: buildDir,
        includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
        ]
    ))
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'

    violationRules {
        rule {
            limit {
                minimum = 0.60 // 60% coverage threshold
            }
        }
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
    ]

    def debugTree = fileTree(
        dir: "${buildDir}/tmp/kotlin-classes/debug",
        excludes: fileFilter
    )

    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(
        dir: buildDir,
        includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
        ]
    ))
}
